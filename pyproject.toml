[project]
name = "hermes-seo"
version = "0.1.2"
description = "SEO workflow and runtime plugin for Hermes Agent"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
  {name = "yuzushi-dev"}
]
maintainers = [
  {name = "yuzushi-dev"}
]
keywords = ["seo", "hermes-agent", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/yuzushi-dev/hermes-seo"
Repository = "https://github.com/yuzushi-dev/hermes-seo"
Issues = "https://github.com/yuzushi-dev/hermes-seo/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
